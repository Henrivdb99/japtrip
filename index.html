 return `<div class="pg"><i style="width:${done/d.length*100}%"></i></div><p class="m">${done} / ${d.length} beoordeeld · kaart ${P[view]+1}</p>${done==d.length?'<p class="m">🎉 Alles beoordeeld. Je kunt nog bladeren en scores aanpassen.</p>':''}`+cardH(it)+`<div class="btns">${E.map((e,s)=>`<button class="${cur===s?'on':''}" onclick="rate(${s})"><b>${e}</b>${L[s]}</button>`).join('')}</div><div class="btns" style="grid-template-columns:1fr 1fr"><button onclick="step(-1,false)">← Vorige</button><button onclick="step(1,false)">Volgende →</button></div>`}
function rows(){return I.filter(i=>(i.n in S.A||i.n in S.H)&&(!fc||i.c==fc)&&(!ft||i.t==ft)).map(i=>({i,a:S.A[i.n],h:S.H[i.n],tot:(S.A[i.n]??0)+(S.H[i.n]??0)})).sort((x,y)=>y.tot-x.tot||(+y.i.r||0)-(+x.i.r||0))}
function setF(){fc=$('#fc').value;ft=$('#ft').value;render()}
const link=()=>location.origin+location.pathname+'#A='+ex(S.A)+'&H='+ex(S.H);
function cp(){const u=link();$('#lk').value=u;try{navigator.clipboard.writeText(u)}catch(e){}$('#lk').select()}
function res(){const cs=[...new Set(I.map(i=>i.c))],r=rows();
 const sel=`<select id="fc" onchange="setF()"><option value="">Alle steden</option>${cs.map(c=>`<option ${c==fc?'selected':''}>${c}</option>`).join('')}</select><select id="ft" onchange="setF()"><option value="">Alles</option><option value="A" ${ft=='A'?'selected':''}>Activiteiten</option><option value="R" ${ft=='R'?'selected':''}>Restaurants</option></select><button class="dl" onclick="dl()">⬇ CSV</button>`;
 const b=r.map(({i,a,h,tot})=>`<tr><td>${i.e} <b>${esc(i.nm)}</b><br><small>${i.c} · ${i.t=='A'?'Activiteit':'Restaurant'} · ${i.r?'★'+i.r:'–'}</small></td><td>${a==null?'–':E[a]}</td><td>${h==null?'–':E[h]}</td><td><b>${tot}</b></td></tr>`).join('');
 return `<p class="m"><b>Delen tussen browsers:</b> klik op de knop, open de link in de andere browser en alles wordt samengevoegd. <button class="dl" onclick="cp()">Kopieer link</button></p><p><input id="lk" readonly placeholder="Hier verschijnt de link" style="width:95%"></p>`+sel+`<div class="tw"><table><tr><th>Item</th><th>${N.A}</th><th>${N.H}</th><th>Totaal</th></tr>${b||'<tr><td colspan="4">Nog niets beoordeeld.</td></tr>'}</table></div>`}
function dl(){const csv=['stad,type,naam,google,annelies,henri,totaal',...rows().map(({i,a,h,tot})=>[i.c,i.t=='A'?'activiteit':'restaurant','"'+i.nm+'"',i.r,a==null?'':L[a],h==null?'':L[h],tot].join(','))].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='korea-japan-scores.csv';a.click()}
function render(){['a','r','z'].forEach(v=>$('#t'+v).className=view==v?'on':'');['A','H'].forEach(w=>$('#w'+w).className=who==w?'on':'');
 $('#app').innerHTML=view=='z'?res():!who?'<p class="m">Kies bovenaan wie je bent (Annelies of Henri) om te beginnen.</p>':deck();
 if(view!='z'&&who&&shown)photo(shown)}
document.addEventListener('keydown',e=>{if(view=='z'||!who||/INPUT|SELECT/.test(e.target.tagName))return;if(e.key>='1'&&e.key<='4')rate(+e.key-1);if(e.key=='ArrowRight')step(1,false);if(e.key=='ArrowLeft')step(-1,false)});
imp();render();
</script></body></html>

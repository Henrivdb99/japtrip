async function api(p,o={}){const K=[CFG.key,CFG.alt];for(;ki<K.length;ki++){const k=K[ki];const r=await fetch(CFG.url+'/rest/v1/'+p,{...o,headers:{apikey:k,...(k.startsWith('eyJ')?{Authorization:'Bearer '+k}:{}),'Content-Type':'application/json',...(o.headers||{})}});if(r.status==401){bad=await r.text();continue}if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,80));const t=await r.text();return t?JSON.parse(t):null}ki=0;throw new Error('401 '+bad.slice(0,100))}

async function addIdea(){const nm=$('#in').value.trim();if(!nm||!who){alert('Vul een naam in en kies bovenaan wie je bent.');return}

 else{U.push(idea({...o,id:Date.now()}));lsave()}

function cardH(it){const k=enc(it.nm+' '+(it.c=='Anders'?'':it.c)),lk=it.link&&/^https?:\/\//.test(it.link)?`<a target="_blank" rel="noopener" href="${esc(it.link)}">🔗 Link</a>`:'';

function deck(){const d=dk();if(P>=d.length)P=0;const it=d[P],m=S[who],done=d.filter(i=>i.n in m).length,cur=m[it.n];shown=it;
 return `<div class="pg"><i style="width:${done/d.length*100}%"></i></div><p class="m">${done} / ${d.length} beoordeeld · kaart ${P+1}${DBON?` · ${st()}`:''}</p>${done==d.length?'<p class="m">🎉 Alles beoordeeld. Je kunt nog bladeren en scores aanpassen.</p>':''}`+cardH(it)+`<div class="btns">${E.map((e,s)=>`<button class="${cur===s?'on':''}" onclick="rate(${s})"><b>${e}</b>${L[s]}</button>`).join('')}</div><div class="btns" style="grid-template-columns:1fr 1fr"><button onclick="step(-1,false)">← Vorige</button><button onclick="step(1,false)">Volgende →</button></div>`}
